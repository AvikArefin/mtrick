<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTRICK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@latest/dist/chartjs-chart-matrix.min.js"></script>
    <script src="exporter.js"></script>
    <style>
        :root {
            /* Default/Dark Theme */
            --bg-body: #111;
            --bg-card: #1e1e1e;
            --border-color: #333;
            --border-active: #666;
            --text-color: #eee;
            --text-muted: #a1a1aa;
            --bg-input: #2a2a2a;
        }

        body.light-theme {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --border-active: #94a3b8;
            --text-color: #0f172a;
            --text-muted: #000000;
            --bg-input: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            border-radius: 0 !important;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Fira Code', monospace;
            background-color: var(--bg-body);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar.hidden {
            width: 0;
            padding-left: 0;
            padding-right: 0;
            border-right-color: transparent;
        }

        .sidebar-content {
            display: flex;
            flex-direction: column;
            width: 280px;
            height: 100%;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .run-item {
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .run-item:hover {
            background: var(--bg-input);
        }

        .run-item.active {
            background: var(--border-color);
            border-color: var(--border-active);
        }

        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .chart-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        #dynamic-charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #run-title-display {
            margin: 0;
        }

        .chart-controls {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            align-items: center;
            font-size: 0.9em;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 400px;
            margin: 0 auto;
        }

        .chart-container.square-mode {
            height: auto;
            aspect-ratio: 1 / 1;
            max-width: 500px;
        }

        pre code {
            display: block;
            background: #09090b;
            padding: 15px;
            overflow-x: auto;
            color: #a5d6ff;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            border: 1px solid var(--border-color);
        }



        .run-note-display[contenteditable="true"]:empty:before {
            content: attr(data-placeholder);
            color: var(--text-muted);
            pointer-events: none;
            display: block;
        }



        .run-note-display[contenteditable="true"]:focus {
            border-color: #fbbf24 !important;
            background: rgba(0, 0, 0, 0.1) !important;
        }



        /* Standardized Icon Buttons */
        .icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            cursor: pointer;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        .icon-btn:hover {
            background: var(--bg-input);
            border-color: var(--border-active);
        }

        .icon-btn:active {
            background: var(--border-color);
        }

        /* Settings Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            width: 420px;
            max-width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
            transform: scale(0.95);
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.open .modal-content-box {
            transform: scale(1);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 1.1em;
            font-weight: 600;
        }

        .modal-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.5em;
            line-height: 1;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        .modal-close-btn:hover {
            color: var(--text-color);
        }

        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .setting-group label {
            font-size: 0.8em;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        select {
            display: block;
            width: 100%;
            height: 32px;
            padding: 5px 8px;
            background: var(--bg-input);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            font-family: inherit;
            font-size: 0.9em;
            outline: none;
            cursor: pointer;
        }

        /* Export Modal Styles */
        .export-modal-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .export-modal-backdrop.open {
            display: flex;
        }
        .export-modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            color: var(--text-color);
        }
        .export-modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .export-modal-header h3 {
            margin: 0;
            font-size: 1.15em;
            font-weight: 600;
        }
        .export-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5em;
            cursor: pointer;
            line-height: 1;
        }
        .export-close-btn:hover {
            color: var(--text-color);
        }
        .export-modal-body {
            display: flex;
            flex-direction: row;
            gap: 20px;
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }
        @media (max-width: 768px) {
            .export-modal-body {
                flex-direction: column;
            }
        }
        .export-controls-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 260px;
        }
        .export-preview-panel {
            flex: 1.4;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .export-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .export-form-group label {
            font-size: 0.85em;
            color: var(--text-muted);
            font-weight: 500;
        }
        .export-input, .export-select {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            height: auto;
            min-height: 38px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.9em;
            line-height: 1.4;
            outline: none;
        }
        .export-select {
            padding-right: 28px;
        }
        .export-input:focus, .export-select:focus {
            border-color: var(--border-active);
        }
        .export-colors-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 160px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .export-color-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85em;
        }
        .export-color-picker {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border: 1px solid var(--border-color);
            background: none;
            cursor: pointer;
            padding: 0;
        }
        .export-color-picker::-webkit-color-swatch-wrapper { padding: 0; }
        .export-color-picker::-webkit-color-swatch { border: none; }
        .export-preview-header {
            font-size: 0.85em;
            color: var(--text-muted);
            font-weight: 500;
        }
        .export-preview-container {
            border: 1px solid var(--border-color);
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            background: #0f172a;
        }
        .export-modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        .export-action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 0.9em;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-color);
        }
        .export-action-btn.primary-btn {
            background: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
        }
        .export-action-btn.primary-btn:hover {
            background: #1d4ed8;
        }
        .export-action-btn.secondary-btn {
            background: #059669;
            color: #ffffff;
            border-color: #10b981;
        }
        .export-action-btn.secondary-btn:hover {
            background: #047857;
        }
        .export-font-preset-btn {
            padding: 4px 10px;
            font-size: 0.8em;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s ease;
        }
        .export-font-preset-btn:hover {
            border-color: #3b82f6;
            color: #3b82f6;
        }
        .export-font-preset-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
        }
        .export-font-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .export-font-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .export-font-item label {
            font-size: 0.78em;
            color: var(--text-muted);
        }
        .export-action-btn.cancel-btn:hover {
            background: var(--border-color);
        }
    </style>
</head>

<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <h3
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; margin-top: 0;">
                Experiment Runs
            </h3>
            <button id="clear-all-btn"
                style="margin-bottom: 15px; padding: 6px 12px; background: var(--bg-input); color: var(--text-color); border: 1px solid var(--border-color); cursor: pointer; font-family: inherit; font-size: 0.85em;">Clear
                All</button>
            <div id="runs-list"></div>
        </div>
    </div>

    <div class="main-content">
        <div class="header-row">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button id="toggle-sidebar-btn" class="icon-btn" title="Toggle Sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="0" ry="0"></rect>
                        <line x1="9" y1="3" x2="9" y2="21"></line>
                    </svg>
                </button>
                <h2 id="run-title-display" style="margin: 0;">Select runs to compare</h2>
            </div>
            <button id="settings-btn" class="icon-btn" title="Global Settings"
                style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-family: inherit; font-size: 0.9em;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
                Settings
            </button>
        </div>
        <div id="run-warnings-container"
            style="display: none; background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; color: #f59e0b; padding: 15px; margin-bottom: 20px;">
        </div>
        <div id="dynamic-charts-container"></div>

    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content-box">
            <div class="modal-header">
                <h3>Global Settings</h3>
                <button class="modal-close-btn" id="settings-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label>Theme</label>
                    <select id="theme-select">
                        <option value="dark">Dark Theme</option>
                        <option value="light">Light Theme</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Plot Font</label>
                    <select id="font-select">
                        <option value="monospace">Monospace</option>
                        <option value="sans-serif">Sans-Serif</option>
                        <option value="serif">Serif</option>
                        <option value="times-new-roman">Times New Roman</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Columns Layout</label>
                    <select id="layout-select">
                        <option value="auto">Auto (Smart)</option>
                        <option value="1">1 Column</option>
                        <option value="2">2 Columns</option>
                        <option value="3">3 Columns</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Non-Line Charts</label>
                    <select id="non-line-select">
                        <option value="latest">Show Latest</option>
                        <option value="all">Show All</option>
                        <option value="none">Show None</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Auto-poll Interval</label>
                    <select id="poll-select">
                        <option value="off">Off</option>
                        <option value="1">1 Second</option>
                        <option value="2">2 Seconds</option>
                        <option value="5">5 Seconds</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script>
        Chart.defaults.animation = false;
        Chart.defaults.elements.point.pointStyle = 'rect';
        const RUN_COLORS = [
            '#3b82f6', '#22c55e', '#ef4444', '#a855f7', '#f59e0b',
            '#ec4899', '#06b6d4', '#10b981', '#f97316', '#6366f1'
        ];
        const DASH_PATTERNS = [[], [5, 5], [2, 2], [8, 4], [12, 6]];
        let allRuns = [];
        let selectedRuns = [];
        let chartInstances = {};
        let chartConfigs = {};


        let currentTheme = 'dark';
        let currentFont = 'monospace';
        let currentLayout = 'auto';
        let currentNonLine = 'latest';
        let currentPollInterval = 'off';
        let pollIntervalId = null;
        let isFetchingRuns = false;

        let themeSelect, fontSelect, layoutSelect, nonLineSelect, pollSelect;

        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                if (response.ok) {
                    const config = await response.json();
                    currentTheme = config.theme || 'dark';
                    currentFont = config.font || 'monospace';
                    currentLayout = config.layout || 'auto';
                    currentNonLine = config.nonLine || 'latest';

                    if (themeSelect) themeSelect.value = currentTheme;
                    if (fontSelect) fontSelect.value = currentFont;
                    if (layoutSelect) layoutSelect.value = currentLayout;
                    if (nonLineSelect) nonLineSelect.value = currentNonLine;

                    applyLayout(false);
                    applyPreferences(false); // don't redraw charts during initial load since they aren't created yet
                }
            } catch (err) {
                console.error("Failed to load global config:", err);
            }
        }

        function loadPollInterval() {
            currentPollInterval = localStorage.getItem('poll-interval') || 'off';
            if (pollSelect) pollSelect.value = currentPollInterval;
            applyPollInterval();
        }

        function applyPollInterval() {
            if (pollIntervalId) {
                clearInterval(pollIntervalId);
                pollIntervalId = null;
            }
            if (currentPollInterval !== 'off') {
                const intervalMs = parseInt(currentPollInterval) * 1000;
                pollIntervalId = setInterval(async () => {
                    if (isFetchingRuns) return;
                    isFetchingRuns = true;
                    try {
                        await fetchRuns();
                    } catch (err) {
                        console.error("Polling error:", err);
                    } finally {
                        isFetchingRuns = false;
                    }
                }, intervalMs);
            }
        }

        async function saveConfig() {
            try {
                await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        theme: currentTheme,
                        font: currentFont,
                        layout: currentLayout,
                        nonLine: currentNonLine
                    })
                });
            } catch (err) {
                console.error("Failed to save global config:", err);
            }
        }

        function applyLayout(resizeCharts = true) {
            const container = document.getElementById('dynamic-charts-container');
            if (currentLayout === 'auto') {
                container.style.gridTemplateColumns = 'repeat(auto-fit, minmax(450px, 1fr))';
            } else {
                container.style.gridTemplateColumns = `repeat(${currentLayout}, 1fr)`;
            }

            if (resizeCharts) {
                setTimeout(() => {
                    Object.values(chartInstances).forEach(chart => chart.resize());
                }, 100);
            }
        }

        function applyPreferences(redrawCharts = true) {
            // Apply theme class
            document.body.classList.toggle('light-theme', currentTheme === 'light');

            // Update Chart.js default font family
            const fontMap = {
                'sans-serif': "'Inter', system-ui, -apple-system, sans-serif",
                'serif': "'Lora', Georgia, Cambria, serif",
                'times-new-roman': "'Times New Roman', Times, Baskerville, Georgia, serif"
            };
            Chart.defaults.font.family = fontMap[currentFont] || "'Fira Code', monospace";

            // Re-render charts to pick up theme/font changes
            if (redrawCharts) {
                Object.keys(chartConfigs).forEach(id => updateChart(id));
            }
        }

        function isOverlayable(type) {
            return ['line', 'line_multi', 'scatter'].includes(type);
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            if (lines.length === 0 || lines[0] === '') return null;
            const headers = lines[0].split(',').map(h => h.trim());
            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                if (cols.length > 1) rows.push(cols);
            }
            return { headers, rows };
        }

        function computeEqualAspectRange(datasets, options) {
            const allVals = [];
            datasets.forEach(ds => ds.data.forEach(d => { allVals.push(d.x); allVals.push(d.y); }));
            const valid = allVals.filter(v => !isNaN(v));
            if (valid.length === 0) return;
            const globalMin = Math.min(...valid);
            const globalMax = Math.max(...valid);
            const padding = (globalMax - globalMin) * 0.1 || 1;
            options.scales.x.min = globalMin - padding;
            options.scales.x.max = globalMax + padding;
            options.scales.y.min = globalMin - padding;
            options.scales.y.max = globalMax + padding;
        }

        function esc(s) {
            if (s == null) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function calculateEMA(data, weight) {
            if (weight <= 0) return data;
            if (data.length === 0) return [];
            let smoothed = [];
            let current = null;
            for (let i = 0; i < data.length; i++) {
                if (data[i] === null || isNaN(data[i])) {
                    smoothed.push(data[i]);
                } else {
                    if (current === null) current = data[i];
                    else current = current * weight + data[i] * (1 - weight);
                    smoothed.push(current);
                }
            }
            return smoothed;
        }

        async function fetchRuns() {
            try {
                const response = await fetch('/api/runs');
                const runs = await response.json();
                allRuns = runs;

                // Avoid rebuilding sidebar UI if a note is currently focused (to prevent cursor jumping)
                const activeNote = document.activeElement && document.activeElement.classList.contains('run-note-display');
                if (activeNote) {
                    selectedRuns.forEach(selectedRun => {
                        const updated = runs.find(r => r.folder === selectedRun.folder);
                        if (updated) {
                            selectedRun.files = updated.files;
                            selectedRun.charts = updated.charts;
                        }
                    });
                    await loadMultipleRunsData();
                    return;
                }

                // Preserve selections
                const selectedFolders = new Set(selectedRuns.map(r => r.folder));
                selectedRuns = [];

                const list = document.getElementById('runs-list');
                list.innerHTML = '';
                runs.forEach((run, index) => {
                    const div = document.createElement('div');
                    div.className = 'run-item';
                    const scriptText = run.source_script ? ` &bull; <span style="color: #a855f7;">${esc(run.source_script)}</span>` : '';
                    const noteText = run.note || '';
                    const runColor = RUN_COLORS[index % RUN_COLORS.length];

                    const shouldBeChecked = selectedFolders.has(run.folder);
                    if (shouldBeChecked) {
                        div.classList.add('active');
                        selectedRuns.push(run);
                    }

                    div.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 8px; width: 100%;">
                            <input type="checkbox" class="run-checkbox" value="${index}" style="cursor: pointer; margin: 0; flex-shrink: 0;" ${shouldBeChecked ? 'checked' : ''}>
                            <span style="width: 12px; height: 12px; background-color: ${runColor}; flex-shrink: 0; display: inline-block;"></span>
                            <b class="run-title-text" style="flex: 1; word-break: break-word; cursor: pointer; font-size: 1.0em; padding-left: 2px;">${esc(run.experiment_name) || 'Experiment'} #${esc(run.experiment_number) || '?'}</b>
                        </div>
                        <div class="run-details-box" style="margin-top: 6px; cursor: pointer;">
                            <div style="font-size: 0.75em; color: var(--text-muted); white-space: nowrap; overflow: hidden;">
                                ${esc((run.timestamp || '').replace(/(....)(..)(..)_(..)(..)(..)/, "$1-$2-$3 $4:$5:$6"))} &bull; ${esc(run.git_commit)}${scriptText}
                            </div>
                            <div class="run-note-container" style="margin-top: 8px; font-size: 0.85em;">
                                <div class="run-note-display" contenteditable="true" data-placeholder="Add a note..." style="word-break: break-word; padding: 4px 6px; background: rgba(0,0,0,0.2); border: 1px dashed transparent; min-height: 1.2em; border-radius: 0; outline: none; cursor: text; line-height: 1.2;">${esc(noteText)}</div>
                            </div>
                        </div>
                    `;
                    const checkbox = div.querySelector('.run-checkbox');
                    checkbox.addEventListener('change', () => {
                        if (checkbox.checked) {
                            div.classList.add('active');
                            if (!selectedRuns.includes(run)) selectedRuns.push(run);
                        } else {
                            div.classList.remove('active');
                            selectedRuns = selectedRuns.filter(r => r !== run);
                        }
                        selectedRuns.sort((a, b) => allRuns.indexOf(a) - allRuns.indexOf(b));
                        loadMultipleRunsData();
                    });

                    div.addEventListener('click', (e) => {
                        if (e.target.closest('.run-checkbox') || e.target.closest('.run-note-display')) {
                            return;
                        }
                        selectedRuns = [run];
                        document.querySelectorAll('.run-checkbox').forEach(cb => {
                            cb.checked = (cb === checkbox);
                            cb.closest('.run-item').classList.toggle('active', cb.checked);
                        });
                        loadMultipleRunsData();
                    });

                    const noteDisplay = div.querySelector('.run-note-display');

                    noteDisplay.addEventListener('click', e => e.stopPropagation());
                    noteDisplay.addEventListener('keydown', e => {
                        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); noteDisplay.blur(); }
                    });
                    noteDisplay.addEventListener('blur', () => {
                        const newNote = noteDisplay.textContent.trim();
                        if (newNote !== (run.note || '')) {
                            run.note = newNote;
                            fetch(`/api/runs/${encodeURIComponent(run.folder)}/note`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ note: newNote })
                            }).catch(console.error);
                        }
                    });

                    list.appendChild(div);
                });

                if (runs.length > 0 && selectedRuns.length === 0) {
                    const checkboxes = list.querySelectorAll('.run-checkbox');
                    const lastCb = checkboxes[checkboxes.length - 1];
                    lastCb.checked = true;
                    lastCb.dispatchEvent(new Event('change'));
                } else {
                    selectedRuns.sort((a, b) => allRuns.indexOf(a) - allRuns.indexOf(b));
                    loadMultipleRunsData();
                }
            } catch (err) {
                console.error("Failed to fetch runs:", err);
            }
        }

        document.getElementById('clear-all-btn').addEventListener('click', () => {
            document.querySelectorAll('.run-checkbox').forEach(cb => {
                if (cb.checked) {
                    cb.checked = false;
                    cb.dispatchEvent(new Event('change'));
                }
            });
        });



        function createChartDOM(id, title, type, layout = {}) {
            let c = '';
            if (type.includes('line')) c += `<label><input type="checkbox" id="log_${id}" onchange="updateChart('${id}')"> Log Y</label><label>Smooth: <input type="range" id="smooth_${id}" min="0" max="0.99" step="0.01" value="0" oninput="updateChart('${id}')"></label>`;
            if (layout.equal_aspect) c += `<label><input type="checkbox" id="equal_${id}" onchange="updateChart('${id}')" checked> Equal X/Y</label>`;
            c += `<button class="icon-btn export-btn" onclick="ChartExporter.openExportModal('${id}')" title="Export Image (4K PNG / SVG)" style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; font-size: 0.8em;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Export</button>`;
            return `<div class="chart-box" id="box_${id}"><div class="chart-controls">${c}</div><div class="chart-container ${(layout.equal_aspect || type === 'heatmap') ? 'square-mode' : ''}" id="container_${id}"><canvas id="canvas_${id}"></canvas></div></div>`;
        }

        let currentLoadId = 0;

        async function loadMultipleRunsData() {
            const loadId = ++currentLoadId;
            const container = document.getElementById('dynamic-charts-container');
            const warningsContainer = document.getElementById('run-warnings-container');

            if (selectedRuns.length === 0) {
                document.getElementById('run-title-display').textContent = 'No runs selected';
                container.innerHTML = '';
                if (warningsContainer) warningsContainer.style.display = 'none';
                Object.values(chartInstances).forEach(c => c.destroy());
                chartInstances = {};
                chartConfigs = {};
                return;
            }

            let titleText = `Comparing ${selectedRuns.length} run(s)`;
            if (selectedRuns.length === 1) {
                titleText = `${selectedRuns[0].experiment_name || 'Experiment'} (Experiment #${selectedRuns[0].experiment_number || '?'})`;
                if (selectedRuns[0].source_script) titleText += ` — Script: ${selectedRuns[0].source_script}`;
            }
            document.getElementById('run-title-display').textContent = titleText;

            if (warningsContainer) {
                warningsContainer.style.display = 'none';
                warningsContainer.innerHTML = '';
            }

            try {
                const nonLineMode = currentNonLine;

                const runPromises = selectedRuns.map(async (run) => {
                    const runIdx = allRuns.indexOf(run);
                    const runCharts = {};
                    const filesToFetch = new Set();

                    // Fetch metrics.jsonl if present in run files
                    if (!run.files || run.files.includes('metrics.jsonl')) {
                        filesToFetch.add('metrics.jsonl');
                    }

                    // Scan run files for any confusion matrix and trajectory files
                    if (run.files) {
                        run.files.forEach(filename => {
                            if (filename.endsWith('confusion.jsonl') || filename === 'trajectory.json') {
                                filesToFetch.add(filename);
                            }
                        });
                    }

                    // Retain support for any explicitly registered charts in meta.json
                    if (run.charts && run.charts.length > 0) {
                        run.charts.forEach(chart => {
                            if (chart.filename) {
                                filesToFetch.add(chart.filename);
                            }
                        });
                    }

                    for (const filename of filesToFetch) {
                        const response = await fetch(`/${run.folder}/${filename}`);
                        if (!response.ok) continue;
                        const text = await response.text();
                        const rows = text.trim().split('\n');
                        if (rows.length === 0 || rows[0] === "") continue;

                        if (filename.endsWith('confusion.jsonl')) {
                            const id = `confusion_${filename.replace(/[^a-zA-Z0-9]/g, '_')}`;
                            runCharts[id] = {
                                type: 'heatmap',
                                title: 'Confusion Matrix',
                                layout: {},
                                series: [],
                                raw_csv: text
                            };
                            continue;
                        }

                        if (filename === 'trajectory.json') {
                            try {
                                const data = JSON.parse(text);
                                let csv = "true_x,true_y,pred_x,pred_y\n";
                                const trueData = data.true || [];
                                const predData = data.pred || [];
                                const maxLen = Math.max(trueData.length, predData.length);
                                for (let i = 0; i < maxLen; i++) {
                                    const tx = trueData[i] ? trueData[i][0] : '';
                                    const ty = trueData[i] ? trueData[i][1] : '';
                                    const px = predData[i] ? predData[i][0] : '';
                                    const py = predData[i] ? predData[i][1] : '';
                                    csv += `${tx},${ty},${px},${py}\n`;
                                }
                                const id = `trajectory_${filename.replace(/[^a-zA-Z0-9]/g, '_')}`;
                                runCharts[id] = {
                                    type: 'scatter',
                                    title: 'Real vs Pred Trajectory',
                                    layout: { show_lines: true, equal_aspect: true },
                                    series: [
                                        { name: 'True', x: 'true_x', y: 'true_y' },
                                        { name: 'Pred', x: 'pred_x', y: 'pred_y' }
                                    ],
                                    raw_csv: csv
                                };
                            } catch (e) {
                                console.error('Failed to parse trajectory.json', e);
                            }
                            continue;
                        }

                        if (filename.endsWith('.jsonl')) {
                            // Parse JSONL file
                            const jsonObjects = rows.map(line => {
                                try { return JSON.parse(line); } catch (e) { return null; }
                            }).filter(obj => obj !== null);

                            if (jsonObjects.length === 0) continue;

                            // Collect all unique keys (excluding epoch and step)
                            const allKeys = new Set();
                            jsonObjects.forEach(obj => {
                                Object.keys(obj).forEach(k => {
                                    if (k !== 'epoch' && k !== 'step') allKeys.add(k);
                                });
                            });

                            const epochs = [];
                            const metricData = {};
                            allKeys.forEach(k => {
                                metricData[k] = { values: [] };
                            });

                            jsonObjects.forEach((obj, i) => {
                                const epochVal = obj.epoch !== undefined ? obj.epoch : (obj.step !== undefined ? obj.step : i);
                                epochs.push(epochVal);
                                allKeys.forEach(k => {
                                    metricData[k].values.push(obj[k] !== undefined ? obj[k] : null);
                                });
                            });

                            // Track columns claimed by manually defined custom charts
                            const claimedColumns = new Set();
                            const fileCharts = (run.charts || []).filter(c => c.filename === filename);
                            fileCharts.forEach(chart => {
                                if (chart.series) chart.series.forEach(s => claimedColumns.add(s.y));
                            });

                            // Prefix Auto-Grouping: group keys by their first namespace parts (divided by '/' or '.')
                            const groups = {};
                            const singleMetrics = [];

                            Object.keys(metricData).forEach(metricName => {
                                if (claimedColumns.has(metricName)) return;

                                const parts = metricName.split(/[\/\.]/);
                                if (parts.length > 1) {
                                    const prefix = parts[0];
                                    const suffix = parts.slice(1).join('/');
                                    if (!groups[prefix]) groups[prefix] = [];
                                    groups[prefix].push({ y: metricName, name: suffix });
                                } else {
                                    singleMetrics.push(metricName);
                                }
                            });

                            // 1. Create multi-series line charts for auto-grouped keys
                            Object.keys(groups).forEach(prefix => {
                                const id = `auto_group_${filename.replace(/[^a-zA-Z0-9]/g, '_')}_${prefix.replace(/[^a-zA-Z0-9]/g, '_')}`;
                                const dsData = {};
                                const series = groups[prefix];
                                series.forEach(s => {
                                    dsData[s.y] = metricData[s.y].values;
                                });

                                runCharts[id] = {
                                    type: 'line_multi',
                                    title: prefix,
                                    layout: {},
                                    series: series,
                                    epochs,
                                    datasetsData: dsData
                                };
                            });

                            // 2. Create single line charts for ungrouped keys
                            singleMetrics.forEach(metricName => {
                                const id = `metric_${filename.replace(/[^a-zA-Z0-9]/g, '_')}_${metricName.replace(/[^a-zA-Z0-9]/g, '_')}`;
                                runCharts[id] = {
                                    type: 'line',
                                    title: metricName,
                                    epochs,
                                    values: metricData[metricName].values,
                                    layout: {}
                                };
                            });

                            // 3. Keep custom manually defined charts (e.g. from meta.json)
                            fileCharts.forEach(chart => {
                                if (chart.series && chart.series.length > 0) {
                                    const id = `custom_${chart.title.replace(/[^a-zA-Z0-9]/g, '_')}`;
                                    const dsData = {};
                                    chart.series.forEach(s => {
                                        if (metricData[s.y]) dsData[s.y] = metricData[s.y].values;
                                    });
                                    runCharts[id] = { type: 'line_multi', title: chart.title, layout: chart.layout || {}, series: chart.series, epochs, datasetsData: dsData };
                                }
                            });
                        }
                    }

                    return { run, runIdx, runCharts };
                });

                const results = await Promise.all(runPromises);
                if (loadId !== currentLoadId) return;

                const nextChartConfigs = {};

                results.forEach(res => {
                    const { run, runIdx, runCharts } = res;
                    const runName = run.experiment_name || `Experiment #${run.experiment_number || runIdx}`;

                    Object.keys(runCharts).forEach(id => {
                        const chartData = runCharts[id];
                        let targetId = id;

                        if (!isOverlayable(chartData.type)) {
                            if (nonLineMode === 'none') return;
                            if (nonLineMode === 'all') {
                                targetId = `${id}_run${runIdx}`;
                            }
                        }

                        if (!nextChartConfigs[targetId]) {
                            nextChartConfigs[targetId] = {
                                type: chartData.type,
                                title: (nonLineMode === 'all' && !isOverlayable(chartData.type) && selectedRuns.length > 1) ? `${chartData.title} (${runName})` : chartData.title,
                                layout: chartData.layout,
                                series: chartData.series,
                                dataByRun: []
                            };
                        }

                        if (nonLineMode === 'latest' && !isOverlayable(chartData.type)) {
                            if (nextChartConfigs[targetId].dataByRun.length === 0 || runIdx < nextChartConfigs[targetId].dataByRun[0].runIdx) {
                                nextChartConfigs[targetId].dataByRun = [{ runName, runIdx, ...chartData }];
                            }
                        } else {
                            nextChartConfigs[targetId].dataByRun.push({ runName, runIdx, ...chartData });
                        }
                    });
                });

                if (loadId !== currentLoadId) return;

                // Diff configs to add/remove/update charts in-place
                const oldIds = Object.keys(chartConfigs);
                const newIds = Object.keys(nextChartConfigs);

                // 1. Remove obsolete charts
                oldIds.forEach(id => {
                    if (!nextChartConfigs[id]) {
                        if (chartInstances[id]) {
                            chartInstances[id].destroy();
                            delete chartInstances[id];
                        }
                        const box = document.getElementById(`box_${id}`);
                        if (box) box.remove();
                        delete chartConfigs[id];
                    }
                });

                // 2. Add or update active charts
                newIds.forEach(id => {
                    const newConfig = nextChartConfigs[id];
                    const isNew = !chartConfigs[id];

                    chartConfigs[id] = newConfig;

                    if (isNew) {
                        container.insertAdjacentHTML('beforeend', createChartDOM(id, newConfig.title, newConfig.type, newConfig.layout));
                    }

                    updateChart(id);
                });

            } catch (err) {
                console.error("Error loading multiple runs data:", err);
            }
        }


        // Setup select dropdown event listeners
        themeSelect = document.getElementById('theme-select');
        themeSelect.addEventListener('change', (e) => {
            currentTheme = e.target.value;
            applyPreferences();
            saveConfig();
        });

        fontSelect = document.getElementById('font-select');
        fontSelect.addEventListener('change', (e) => {

            saveConfig();
        });

        layoutSelect = document.getElementById('layout-select');
        layoutSelect.addEventListener('change', (e) => {

            applyLayout(true);
            saveConfig();
        });

        nonLineSelect = document.getElementById('non-line-select');
        nonLineSelect.addEventListener('change', (e) => {
            currentNonLine = e.target.value;
            loadMultipleRunsData();
            saveConfig();
        });

        pollSelect = document.getElementById('poll-select');
        pollSelect.addEventListener('change', (e) => {
            currentPollInterval = e.target.value;
            localStorage.setItem('poll-interval', e.target.value);
            applyPollInterval();
        });

        // Sidebar Hide/Toggle Logic
        const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');
        const sidebar = document.getElementById('sidebar');

        toggleSidebarBtn.addEventListener('click', () => {
            const isHidden = sidebar.classList.toggle('hidden');

            }
            localStorage.setItem('sidebar-hidden', isHidden);

            Object.values(chartInstances).forEach(chart => chart.resize());
        });

        // Settings Modal Toggle Logic
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const settingsCloseBtn = document.getElementById('settings-close-btn');

        settingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('open');
        });

        settingsCloseBtn.addEventListener('click', () => {

        });

        settingsModal.addEventListener('click', (e) => {

        // Initialize preferences and load runs
        async function init() {
            // Restore sidebar hidden state
            const sidebarHidden = localStorage.getItem('sidebar-hidden') === 'true';
            if (sidebarHidden) {
                sidebar.classList.add('hidden');
                toggleSidebarBtn.style.background = 'var(--border-color)';
                toggleSidebarBtn.style.borderColor = 'var(--border-active)';
            }

            await loadConfig();
            await fetchRuns();
            loadPollInterval();
        }
        init();

        function updateChart(id) {
            const config = chartConfigs[id];
            if (!config) return;

            const isLightTheme = currentTheme === 'light';
            const textColor = isLightTheme ? '#0f172a' : '#eee';
            const tickColor = isLightTheme ? '#000000' : '#FFFFFF';
            const gridColor = isLightTheme ? '#e2e8f0' : '#333';
            const heatmapBorderColor = isLightTheme ? '#ffffff' : '#333';

            const ctx = document.getElementById(`canvas_${id}`).getContext('2d');

            // Destroy and recreate only if the chart type has changed
            if (chartInstances[id]) {
                const existingType = chartInstances[id].config.type;
                const targetType = config.type === 'heatmap' ? 'matrix' : 'line';
                if (existingType !== targetType) {
                    chartInstances[id].destroy();
                    delete chartInstances[id];
                }
            }

            const logEl = document.getElementById(`log_${id}`);
            const isLog = logEl ? logEl.checked : false;

            const smoothEl = document.getElementById(`smooth_${id}`);
            const smoothWeight = smoothEl ? parseFloat(smoothEl.value) : 0;

            const equalEl = document.getElementById(`equal_${id}`);
            const isEqual = equalEl ? equalEl.checked : (config.layout && config.layout.equal_aspect || false);

            if (isEqual || config.type === 'heatmap') {
                document.getElementById(`container_${id}`).classList.add('square-mode');
            } else {
                document.getElementById(`container_${id}`).classList.remove('square-mode');
            }

            if (config.type === 'line' || config.type === 'line_multi' || config.type === 'scatter') {
                const datasets = [];

                config.dataByRun.forEach(runData => {
                    const runName = runData.runName;
                    const run = allRuns[runData.runIdx];
                    const c = RUN_COLORS[runData.runIdx % RUN_COLORS.length];
                    const c_raw = c + '40';

                    if (config.type === 'line' || config.type === 'line_multi') {
                        // Normalize 'line' into a single-series 'line_multi' shape
                        const seriesList = config.type === 'line'
                            ? [{ name: config.dataByRun.length > 1 ? runName : 'Value', y: '__value__' }]
                            : config.series;
                        const getData = (col) => col === '__value__' ? runData.values : (runData.datasetsData && runData.datasetsData[col]);

                        let seriesIdx = 0;
                        seriesList.forEach(s => {
                            const seriesName = s.name || s.y;
                            const vals = getData(s.y);
                            if (!vals) return;

                            const rawPoints = runData.epochs.map((e, i) => ({ x: e, y: vals[i] }));
                            const smoothed = calculateEMA(vals, smoothWeight);
                            const smoothedPoints = runData.epochs.map((e, i) => ({ x: e, y: smoothed[i] }));
                            const dash = DASH_PATTERNS[seriesIdx % DASH_PATTERNS.length];

                            let label = config.dataByRun.length > 1 && config.type === 'line_multi' ? `${seriesName} (${runName})` : seriesName;
                            let rawLabel = config.dataByRun.length > 1 ? `${seriesName} (${config.type === 'line_multi' ? runName + ' ' : ''}Raw)` : `${seriesName === 'Value' ? '' : seriesName + ' '}Raw`;
                            // For single-series line with single run, use title/runName when smoothWeight is 0, and Smoothed/Raw when smoothing is active
                            if (config.type === 'line' && config.dataByRun.length === 1) {
                                label = smoothWeight > 0 ? 'Smoothed' : (config.title || runName);
                                rawLabel = 'Raw';
                            }

                            if (smoothWeight > 0) datasets.push({ label: rawLabel, data: rawPoints, borderColor: c_raw, backgroundColor: c_raw, borderWidth: 1, pointRadius: 0, showLine: true, borderDash: dash });
                            datasets.push({ label: label, data: smoothedPoints, borderColor: c, backgroundColor: c, borderWidth: 2, pointRadius: smoothWeight > 0 ? 0 : 1.5, showLine: true, borderDash: dash });
                            seriesIdx++;
                        });
                    }
                    else if (config.type === 'scatter') {
                        const csv = parseCSV(runData.raw_csv);
                        if (!csv) return;

                        config.series.forEach((s, sIdx) => {
                            const xIdx = csv.headers.indexOf(s.x);
                            const yIdx = csv.headers.indexOf(s.y);
                            if (xIdx === -1 || yIdx === -1) return;

                            const data = [];
                            csv.rows.forEach(cols => {
                                if (cols.length > Math.max(xIdx, yIdx)) {
                                    const xVal = parseFloat(cols[xIdx]);
                                    const yVal = parseFloat(cols[yIdx]);
                                    if (!isNaN(xVal) && !isNaN(yVal)) data.push({ x: xVal, y: yVal });
                                }
                            });

                            const labelPrefix = config.dataByRun.length > 1 ? `${s.name || 'Series'} (${runName})` : (s.name || `Series ${sIdx + 1}`);
                            const showLines = config.layout && config.layout.show_lines;
                            const dash = showLines ? DASH_PATTERNS[sIdx % DASH_PATTERNS.length] : [];
                            const seriesColor = config.dataByRun.length > 1 ? c : RUN_COLORS[sIdx % RUN_COLORS.length];

                            datasets.push({
                                label: labelPrefix, data, borderColor: seriesColor, backgroundColor: seriesColor,
                                showLine: !!showLines, borderWidth: showLines ? 1.5 : undefined,
                                pointRadius: 2.5, borderDash: dash
                            });
                        });
                    }
                });

                let options = {
                    responsive: true, maintainAspectRatio: !isEqual, aspectRatio: isEqual ? 1 : undefined, animation: false, color: textColor,
                    scales: {
                        x: { type: 'linear', ticks: { color: tickColor }, grid: { color: gridColor } },
                        y: { type: isLog ? 'logarithmic' : 'linear', ticks: { color: tickColor }, grid: { color: gridColor } }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: config.title,
                            color: textColor,
                            font: { size: 16, weight: 'bold' },
                            padding: { top: 10, bottom: 10 }
                        },
                        legend: {
                            labels: {
                                usePointStyle: true,
                                color: textColor,
                                padding: 15,
                                font: { size: 12 },
                                generateLabels(chart) {
                                    return chart.data.datasets.map((ds, i) => {
                                        const meta = chart.getDatasetMeta(i);
                                        return {
                                            text: ds.label,
                                            fontColor: textColor,
                                            fillStyle: ds.borderColor,
                                            strokeStyle: ds.borderColor,
                                            lineWidth: ds.showLine ? (ds.borderWidth || 2) : 0,
                                            lineDash: ds.borderDash || [],
                                            pointStyle: ds.showLine ? 'line' : 'rect',
                                            hidden: meta.hidden,
                                            datasetIndex: i
                                        };
                                    });
                                }
                            }
                        }
                    }
                };
                if (!isEqual) {
                    options.maintainAspectRatio = false;
                    delete options.aspectRatio;
                }

                if (config.type === 'scatter' && isEqual) {
                    computeEqualAspectRange(datasets, options);
                }

                if (chartInstances[id]) {
                    const chart = chartInstances[id];
                    chart.options.scales.x.ticks.color = tickColor;
                    chart.options.scales.x.grid.color = gridColor;
                    chart.options.scales.y.type = isLog ? 'logarithmic' : 'linear';
                    chart.options.scales.y.ticks.color = tickColor;
                    chart.options.scales.y.grid.color = gridColor;
                    chart.options.plugins.title.text = config.title;
                    chart.options.plugins.title.color = textColor;
                    chart.options.plugins.legend.labels.color = textColor;
                    chart.options.color = textColor;

                    if (isEqual) {
                        chart.options.maintainAspectRatio = true;
                        chart.options.aspectRatio = 1;
                        computeEqualAspectRange(datasets, chart.options);
                    } else {
                        chart.options.maintainAspectRatio = false;
                        delete chart.options.aspectRatio;
                    }

                    chart.data.datasets = datasets;
                    chart.update('none');
                } else {
                    chartInstances[id] = new Chart(ctx, {
                        type: 'line',
                        data: { datasets: datasets },
                        options: options
                    });
                }
            }
            else if (config.type === 'heatmap') {
                const runData = config.dataByRun[0];
                if (!runData) return;

                const rows = runData.raw_csv.trim().split('\n');
                const jsonObjects = rows.map(line => {
                    try { return JSON.parse(line); } catch (e) { return null; }
                }).filter(obj => obj !== null);

                if (jsonObjects.length === 0) return;

                const matrixData = [];
                let maxCount = 0;

                // Dynamically collect class labels sorted by their index
                const classLabelMap = {};
                jsonObjects.forEach(obj => {
                    if (obj.true_class !== undefined && obj.true_label !== undefined) {
                        classLabelMap[obj.true_class] = obj.true_label;
                    }
                    if (obj.pred_class !== undefined && obj.pred_label !== undefined) {
                        classLabelMap[obj.pred_class] = obj.pred_label;
                    }
                });

                // Extract unique indices, sort them, and map to label strings
                const sortedIndices = Object.keys(classLabelMap).map(Number).sort((a, b) => a - b);
                const classLabels = sortedIndices.map(idx => classLabelMap[idx]);

                jsonObjects.forEach(obj => {
                    const x_idx = obj.pred_class;
                    const y_idx = obj.true_class;
                    const count = obj.count;

                    if (x_idx === undefined || y_idx === undefined || count === undefined) return;

                    if (count > maxCount) maxCount = count;

                    matrixData.push({
                        x: classLabelMap[x_idx] || `Class ${x_idx}`,
                        y: classLabelMap[y_idx] || `Class ${y_idx}`,
                        v: count
                    });
                });

                const numClasses = classLabels.length || 1;

                if (chartInstances[id]) {
                    const chart = chartInstances[id];
                    chart.options.scales.x.title.color = textColor;
                    chart.options.scales.x.ticks.color = tickColor;
                    chart.options.scales.y.title.color = textColor;
                    chart.options.scales.y.ticks.color = tickColor;
                    chart.options.plugins.title.text = config.title;
                    chart.options.plugins.title.color = textColor;
                    chart.options.color = textColor;

                    chart.data.datasets[0].data = matrixData;
                    chart.data.datasets[0].borderColor = heatmapBorderColor;
                    chart.update('none');
                } else {
                    chartInstances[id] = new Chart(ctx, {
                        type: 'matrix',
                        data: {
                            datasets: [{
                                label: config.title,
                                data: matrixData,
                                backgroundColor(context) {
                                    const dataItem = context.dataset.data[context.dataIndex];
                                    const value = dataItem ? dataItem.v : 0;
                                    const maxVal = Math.max(...context.dataset.data.map(d => d.v || 0), 0);
                                    const alpha = maxVal > 0 ? (0.15 + 0.85 * value / maxVal) : 0;
                                    return `rgba(59, 130, 246, ${alpha})`;
                                },
                                borderColor: heatmapBorderColor,
                                borderWidth: 2,
                                width: ({ chart }) => {
                                    const area = chart.chartArea;
                                    if (!area) return 0;
                                    return (area.width / numClasses) - 4;
                                },
                                height: ({ chart }) => {
                                    const area = chart.chartArea;
                                    if (!area) return 0;
                                    return (area.height / numClasses) - 4;
                                }
                            }]
                        },
                        options: {
                            animation: false, responsive: true, maintainAspectRatio: false, color: textColor,
                            scales: {
                                x: {
                                    type: 'category',
                                    title: { display: true, text: 'Predicted Class', color: textColor },
                                    ticks: { color: tickColor },
                                    grid: { display: false },
                                    offset: true
                                },
                                y: {
                                    type: 'category',
                                    title: { display: true, text: 'True Class', color: textColor },
                                    ticks: { color: tickColor },
                                    grid: { display: false },
                                    offset: true,
                                    reverse: true
                                }
                            },
                            plugins: {
                                title: {
                                    display: true,
                                    text: config.title,
                                    color: textColor,
                                    font: { size: 16, weight: 'bold' },
                                    padding: { top: 10, bottom: 10 }
                                },
                                tooltip: {
                                    callbacks: {
                                        title() { return ''; },
                                        label(context) {
                                            const v = context.dataset.data[context.dataIndex];
                                            return ['True: ' + v.y, 'Pred: ' + v.x, 'Count: ' + v.v];
                                        }
                                    }
                                }
                            }
                        },
                        plugins: [{
                            id: 'matrixText',
                            afterDatasetsDraw(chart) {
                                const ctx = chart.ctx;
                                const maxVal = Math.max(...chart.data.datasets[0].data.map(d => d.v || 0), 0);
                                chart.data.datasets.forEach((dataset, i) => {
                                    const meta = chart.getDatasetMeta(i);
                                    meta.data.forEach((element, index) => {
                                        const value = dataset.data[index].v;
                                        const cellW = element.width || 0;
                                        const cellH = element.height || 0;
                                        const alpha = maxVal > 0 ? (0.15 + 0.85 * value / maxVal) : 0;
                                        ctx.fillStyle = alpha > 0.55 ? '#fff' : (isLightTheme ? '#0f172a' : '#fff');
                                        ctx.font = `bold 14px ${Chart.defaults.font.family || 'monospace'}`;
                                        ctx.textAlign = 'center';
                                        ctx.textBaseline = 'middle';
                                        ctx.fillText(value, element.x + cellW / 2, element.y + cellH / 2);
                                    });
                                });
                            }
                        }]
                    });
                }
            }
        }
        // Layout change handled in setup listeners above
    </script>
</body>
